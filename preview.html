<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wolf preview</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{padding:0 0 60px}
  .pv{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 0;display:flex;flex-direction:column;gap:22px}
  .pv h1{font-family:var(--serif);font-weight:700;font-size:26px;font-variation-settings:"SOFT" 30,"WONK" 1}
  .pv .h{padding-top:8px}
  .stagebox{display:flex;flex-direction:column;align-items:center;gap:10px}
  .stagebox .hero{margin:0}
  .ctl{display:flex;align-items:center;gap:10px;width:100%}
  .ctl input[type=range]{flex:1;accent-color:var(--golden)}
  .ctl .n{font-family:var(--serif);font-weight:700;font-size:28px;min-width:2ch;text-align:center;font-variation-settings:"SOFT" 30,"WONK" 1}
  .ctl button{width:44px;height:44px;border-radius:12px;background:rgba(20,18,16,.5);border:1px solid var(--line);color:var(--bone);font-size:18px}
  .play{align-self:center}
  .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ico{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:16px;background:rgba(20,18,16,.58);border:1px solid var(--line);color:var(--ash)}
  .ico .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(239,233,223,.06);color:var(--golden)}
  .ico .ic svg{width:26px;height:26px}
  .ico span{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row2 .h{margin-bottom:8px}
</style></head><body>
<canvas id="grain" aria-hidden="true"></canvas>
<div class="plate" id="plate" style="background-image:url(img/bg/01.webp)"></div>
<div class="pv">
  <h1>Wolf, 1 to 10</h1>
  <div class="stagebox">
    <div class="hero"><div class="stage-art" id="wolfArt"><img class="a" id="wolfImg" src="img/wolf/01.webp?v=38" alt=""><span class="flick"></span><span class="flick b"></span></div></div>
    <div class="ctl"><button id="wPrev">‹</button><input type="range" id="wRange" min="1" max="10" value="1"><span class="n" id="wN">1</span><button id="wNext">›</button></div>
    <button class="btn play" id="wPlay">Play</button>
  </div>

  <h1>Brain, 1 to 10</h1>
  <div class="stagebox">
    <div class="hero"><div class="stage-art" id="brainArt"><img class="a" id="brainImg" src="img/brain/01.webp" alt=""><span class="flick"></span><span class="flick b"></span></div></div>
    <div class="ctl"><button id="bPrev">‹</button><input type="range" id="bRange" min="1" max="10" value="1"><span class="n" id="bN">1</span><button id="bNext">›</button></div>
    <button class="btn play" id="bPlay">Play</button>
  </div>

  <h1>Icons</h1>
  <div class="row2">
    <div><h2 class="h">Outline</h2><div class="icons" id="outline" style="grid-template-columns:repeat(3,1fr)"></div></div>
    <div><h2 class="h">Solid</h2><div class="icons" id="solid" style="grid-template-columns:repeat(3,1fr)"></div></div>
  </div>
</div>
<script>
const O = {
  sunrise:'<path d="M3 15h14M5.5 12a4.5 4.5 0 0 1 9 0M10 3v3M4.2 6.2l1.4 1.4M15.8 6.2l-1.4 1.4"/>',
  sun:'<circle cx="10" cy="10" r="3.2"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/>',
  drop:'<path d="M10 3c3 3.6 5 6.2 5 8.7a5 5 0 0 1-10 0C5 9.2 7 6.6 10 3z"/>',
  egg:'<path d="M10 3c3 0 5.5 4.2 5.5 8a5.5 5.5 0 0 1-11 0C4.5 7.2 7 3 10 3z"/>',
  pill:'<rect x="3" y="7" width="14" height="6" rx="3" transform="rotate(-35 10 10)"/><path d="M8.2 6.2l3.6 5.2"/>',
  cup:'<path d="M4 7h9v5.5a3.5 3.5 0 0 1-3.5 3.5h-2A3.5 3.5 0 0 1 4 12.5V7zM13 8.5h1.5a2 2 0 0 1 0 4H13"/>',
  cupoff:'<path d="M4 7h9v5.5a3.5 3.5 0 0 1-3.5 3.5h-2A3.5 3.5 0 0 1 4 12.5V7zM13 8.5h1.5a2 2 0 0 1 0 4H13M3 17L17 3"/>',
  leafoff:'<path d="M16 4c-6 0-10 3-10 9 0 1 .2 2 .6 3C11.5 16 15 12 16 4zM6.6 16C8 12.5 10 10 13 8M3 17L17 3"/>',
  dumbbell:'<path d="M6.5 10h7M3 8v4M17 8v4M5 6.5v7M15 6.5v7"/>',
  phoneoff:'<rect x="6" y="2.5" width="8" height="15" rx="2"/><path d="M9 15h2M3 17L17 3"/>',
  moon:'<path d="M15.5 12.5A6 6 0 0 1 7.5 4.5a6 6 0 1 0 8 8z"/>'
};
const S = {
  sunrise:'<path d="M5.2 12.5a4.8 4.8 0 0 1 9.6 0z"/><path d="M2.5 15h15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M10 2.6v2.6M4 6.2l1.8 1.8M16 6.2l-1.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  sun:'<circle cx="10" cy="10" r="4"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  drop:'<path d="M10 2.5c3.2 3.8 5.3 6.6 5.3 9.3a5.3 5.3 0 0 1-10.6 0C4.7 9.1 6.8 6.3 10 2.5z"/>',
  egg:'<path d="M10 2.5c3.2 0 5.8 4.5 5.8 8.4a5.8 5.8 0 0 1-11.6 0C4.2 7 6.8 2.5 10 2.5z"/>',
  pill:'<rect x="2.5" y="6.8" width="15" height="6.4" rx="3.2" transform="rotate(-35 10 10)"/><path d="M8 6l4 5.8" stroke="#141210" stroke-width="1.6" stroke-linecap="round"/>',
  cup:'<path d="M3.5 6.5h10v6a3.5 3.5 0 0 1-3.5 3.5H7a3.5 3.5 0 0 1-3.5-3.5v-6z"/><path d="M13.5 8h1.3a2.2 2.2 0 0 1 0 4.4h-1.3" stroke="currentColor" stroke-width="1.8" fill="none"/>',
  cupoff:'<path d="M3.5 6.5h10v6a3.5 3.5 0 0 1-3.5 3.5H7a3.5 3.5 0 0 1-3.5-3.5v-6z"/><path d="M13.5 8h1.3a2.2 2.2 0 0 1 0 4.4h-1.3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M2.5 17.5l15-15" stroke="#141210" stroke-width="3.4" stroke-linecap="round"/><path d="M2.5 17.5l15-15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  leafoff:'<path d="M16.5 3.5c-7 0-11 3.5-11 9.5 0 1.3.3 2.4.8 3.3C12 15.5 16 11.5 16.5 3.5z"/><path d="M2.5 17.5l15-15" stroke="#141210" stroke-width="3.4" stroke-linecap="round"/><path d="M2.5 17.5l15-15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  dumbbell:'<rect x="6.5" y="9" width="7" height="2"/><rect x="4" y="6" width="2.6" height="8" rx="1"/><rect x="13.4" y="6" width="2.6" height="8" rx="1"/><rect x="2" y="8" width="1.6" height="4" rx=".8"/><rect x="16.4" y="8" width="1.6" height="4" rx=".8"/>',
  phoneoff:'<rect x="5.5" y="2" width="9" height="16" rx="2.2"/><rect x="8.5" y="14.6" width="3" height="1.2" rx=".6" fill="#141210"/><path d="M2.5 17.5l15-15" stroke="#141210" stroke-width="3.4" stroke-linecap="round"/><path d="M2.5 17.5l15-15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  moon:'<path d="M16 12.6A6.6 6.6 0 0 1 7.4 4a6.6 6.6 0 1 0 8.6 8.6z"/>'
};
const names={sunrise:'Up',sun:'Sun',drop:'Water',egg:'Food',pill:'Vits',cup:'Coffee',cupoff:'Caffeine',leafoff:'Nicotine',dumbbell:'Gym',phoneoff:'Phone',moon:'Bed'};
const o=document.getElementById('outline'), s=document.getElementById('solid');
for (const k in O){
  o.insertAdjacentHTML('beforeend',`<div class="ico"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${O[k]}</svg></span><span>${names[k]}</span></div>`);
  s.insertAdjacentHTML('beforeend',`<div class="ico"><span class="ic"><svg viewBox="0 0 20 20" fill="currentColor">${S[k]}</svg></span><span>${names[k]}</span></div>`);
}
function wire(kind,img,range,n,prev,next,play){
  const set=v=>{v=Math.min(10,Math.max(1,v));range.value=v;n.textContent=v;if(img.tagName==='VIDEO'){img.poster=`img/${kind}/${String(v).padStart(2,'0')}.webp`;img.src=`img/${kind}/${String(v).padStart(2,'0')}.mp4`;img.play().catch(()=>{});}else{img.src=`img/${kind}/${String(v).padStart(2,'0')}.webp?v=38`;}};
  range.oninput=()=>set(+range.value); prev.onclick=()=>set(+range.value-1); next.onclick=()=>set(+range.value+1);
  let t=null; play.onclick=()=>{ if(t){clearInterval(t);t=null;play.textContent='Play';return;} let v=1,dir=1; set(1); play.textContent='Stop'; t=setInterval(()=>{v+=dir; if(v>=10||v<=1) dir=-dir; set(v);},kind==='wolf'?2500:450); };
  for (let i=1;i<=10;i++){ new Image().src=`img/${kind}/${String(i).padStart(2,'0')}.webp?v=38`; }
}
wire('wolf',wolfImg,wRange,wN,wPrev,wNext,wPlay); wire('brain',brainImg,bRange,bN,bPrev,bNext,bPlay);
(function grain(){const cv=document.getElementById('grain');const c=cv.getContext('2d');const w=400,h=800;cv.width=w;cv.height=h;const f=[];for(let k=0;k<4;k++){const id=c.createImageData(w,h);const d=id.data;for(let i=0;i<d.length;i+=4){const v=96+(Math.random()*128)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}f.push(id);}let i=0;setInterval(()=>{c.putImageData(f[i],0,0);i=(i+1)%4;},125);})();
</script></body></html>
