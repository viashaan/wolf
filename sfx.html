<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wolf sound picker</title>
<style>body{margin:0;background:#141210;color:#EFE9DF;font-family:-apple-system,Helvetica,sans-serif;padding:22px 16px 80px}h1{font-size:20px;margin:0 0 4px}p{color:#B3A793;font-size:13px;margin:0 0 14px}
h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B3A793;margin:22px 0 8px;display:flex;justify-content:space-between}h2 b{color:#F7CE4A;font-weight:600;letter-spacing:0;text-transform:none}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.b{min-height:50px;padding:8px 12px;border-radius:12px;border:1px solid rgba(239,233,223,.18);background:rgba(239,233,223,.05);color:#EFE9DF;font:inherit;font-size:14px;text-align:left}.b:active{background:rgba(239,233,223,.14)}.b.on{background:#F7CE4A;border-color:#F7CE4A;color:#1A1204;font-weight:600}
.sum{position:fixed;left:0;right:0;bottom:0;background:rgba(20,18,16,.95);border-top:1px solid rgba(239,233,223,.14);padding:12px 16px;font-size:12px;color:#B3A793;backdrop-filter:blur(10px)}.sum b{color:#EFE9DF;font-weight:500}</style></head><body>
<h1>Wolf sound picker</h1><p>Tap to hear. Tap again to select (gold). Your picks show at the bottom; tell me when you are done and I will bake them into the app.</p>
<div id="l"></div><div class="sum" id="sum"></div>
<script>
const D={"tick": [["tick-bamboo.mp3", "bamboo"], ["tick-bubble.mp3", "bubble"], ["tick-glass.mp3", "glass"], ["tick-kalimba-a.mp3", "kalimba"], ["tick-kalimba-b.mp3", "felt piano"], ["tick-marimba.mp3", "marimba"], ["tick-pencil.mp3", "pencil"], ["tick-punchy.mp3", "punchy"], ["tick-tongue-a.mp3", "tongue drum"], ["tick-warm.mp3", "warm"], ["tick-wood.mp3", "wood"]], "untick": [["untick-punchy.mp3", "punchy"], ["untick-warm.mp3", "warm"], ["untick-wood.mp3", "wood"]], "complete": [["complete-a.mp3", "a"], ["complete-b.mp3", "b"], ["complete-bowl.mp3", "bowl"], ["complete-bowl2.mp3", "bowl2"], ["complete-chime.mp3", "chime"], ["complete-drop.mp3", "drop"], ["complete-felt.mp3", "felt"], ["complete-gong.mp3", "gong"], ["complete-harp.mp3", "harp"], ["complete-piano2.mp3", "piano2"], ["complete-punchy.mp3", "punchy"], ["complete-warm.mp3", "warm"]], "checkin": [["checkin-a.mp3", "a"], ["checkin-b.mp3", "b"], ["checkin-bowl.mp3", "bowl"], ["checkin-chime.mp3", "chime"], ["checkin-crickets.mp3", "crickets"], ["checkin-exhale.mp3", "exhale"], ["checkin-felt.mp3", "felt"], ["checkin-gong.mp3", "gong"], ["checkin-piano.mp3", "piano"], ["checkin-punchy.mp3", "punchy"], ["checkin-warm.mp3", "warm"]], "milestone": [["milestone-a.mp3", "a"], ["milestone-belltree.mp3", "belltree"], ["milestone-bowl.mp3", "bowl"], ["milestone-gong.mp3", "gong"], ["milestone-harp.mp3", "harp"], ["milestone-punchy.mp3", "punchy"], ["milestone-warm.mp3", "warm"]], "stageup": [["stageup-a.mp3", "a"], ["stageup-breath.mp3", "breath"], ["stageup-drum.mp3", "drum"], ["stageup-punchy.mp3", "punchy"], ["stageup-warm.mp3", "warm"]], "stagedown": [["stagedown-a.mp3", "a"], ["stagedown-felt.mp3", "felt"], ["stagedown-punchy.mp3", "punchy"], ["stagedown-warm.mp3", "warm"], ["stagedown-wood.mp3", "wood"]], "click": [["click-a.mp3", "a"], ["click-bamboo.mp3", "bamboo"], ["click-cloth.mp3", "cloth"], ["click-felt.mp3", "felt"], ["click-paper.mp3", "paper"], ["click-punchy.mp3", "punchy"], ["click-warm.mp3", "warm"], ["click-wood.mp3", "wood"]]};
const K="wolf.picks"; let picks={}; try{picks=JSON.parse(localStorage.getItem(K)||"{}")}catch{}
const pool={}; function play(f,rate){let a=pool[f]; if(!a){a=new Audio("sfx/lib/"+f); a.preservesPitch=false; a.webkitPreservesPitch=false; pool[f]=a} a.pause(); a.currentTime=0; a.playbackRate=rate||1; a.play().catch(()=>{})}
let t=0; const L=document.getElementById("l"); let last=null;
function paint(){document.querySelectorAll(".b").forEach(b=>b.classList.toggle("on",picks[b.dataset.ev]===b.dataset.f)); const s=Object.entries(picks).map(([e,f])=>`<b>${e}</b> ${f.slice(e.length+1,-4)}`).join(" · "); document.getElementById("sum").innerHTML=s||"nothing picked yet"}
Object.entries(D).forEach(([ev,list])=>{const h=document.createElement("h2"); h.innerHTML=`<span>${ev}</span><b>${list.length} options</b>`; L.appendChild(h); const g=document.createElement("div"); g.className="g";
 list.forEach(([f,label])=>{const b=document.createElement("button"); b.className="b"; b.dataset.ev=ev; b.dataset.f=f; b.textContent=label;
  b.onclick=()=>{ if(last===f){ picks[ev]=f; localStorage.setItem(K,JSON.stringify(picks)); paint(); } last=f; play(f, ev==="tick"?0.95+0.19*((t++%11)/10):1); };
  g.appendChild(b)}); L.appendChild(g)});
paint();
</script></body></html>
